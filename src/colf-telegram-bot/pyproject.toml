[project]
name = "colf-telegram-bot"
version = "0.1.0"
description = "Telegram bot for COLF expense management"
authors = [
    { name = "Lorenzo Baso", email = "your.email@example.com" }
]
dependencies = [
    "python-telegram-bot>=21.0.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = []