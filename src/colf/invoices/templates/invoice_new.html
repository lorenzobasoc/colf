{% extends "base.html" %}
{% block title %}Nuova fattura{% endblock %}
{% block content %}
<h1 class="mb-4">Nuova fattura</h1>
<form method="post" action="/ui/invoices">
  <div class="mb-3">
    <label class="form-label">Cliente</label>
    <select name="cliente_id" class="form-select" required
            onchange="prefillTemplate(this)">
      <option value="">Seleziona cliente…</option>
      {% for c in clients %}
      <option value="{{ c.id }}"
              data-descrizione="{{ c.descrizione_default or '' }}"
              data-giorni="{{ c.giorni_pagamento_default }}">
        {{ c.ragione_sociale }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Descrizione</label>
    <input type="text" name="descrizione" id="descrizione" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Importo (€)</label>
    <input type="text" name="importo" class="form-control" placeholder="1000.00" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Data emissione</label>
    <input type="date" name="data_emissione" class="form-control" value="{{ today }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Giorni pagamento</label>
    <input type="number" name="giorni_pagamento" id="giorni_pagamento" class="form-control" value="30" required>
  </div>
  <button type="submit" class="btn btn-primary">Emetti e invia al SdI</button>
  <a href="/ui/invoices" class="btn btn-secondary ms-2">Annulla</a>
</form>
<script>
function prefillTemplate(sel) {
  const opt = sel.options[sel.selectedIndex];
  document.getElementById("descrizione").value = opt.dataset.descrizione || "";
  document.getElementById("giorni_pagamento").value = opt.dataset.giorni || 30;
}
</script>
{% endblock %}
