services:
  colf:
    container_name: colf
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    ports:
      - "9901:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "app=colf"
      - "service=api"
    networks:
      - universe

  telegram-bot:
    container_name: colf-telegram-bot
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_BASE_URL=http://colf:8000
    restart: unless-stopped
    command: ["uv", "run", "python", "src/infrastructure/telegram/run.py"]
    depends_on:
      - colf
    labels:
      - "app=colf"
      - "service=telegram-bot"
    networks:
      - universe

networks:
  universe:
    external: true